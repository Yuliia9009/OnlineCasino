<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10B981" flood-opacity="0.25"/>
    </filter>
    <style>
      .card{fill:url(#g2);stroke:#1F2937;stroke-width:1.5;rx:16}
      .txt{font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial;}
      .title{fill:#E5E7EB;font-weight:700;font-size:22px}
      .muted{fill:#9CA3AF;font-size:15px}
      .label{fill:#D1FAE5;font-size:14px}
      .chip{fill:#065F46; stroke:#10B981; stroke-opacity:.5; rx:10}
      .chip2{fill:#0B3B74; stroke:#60A5FA; stroke-opacity:.5; rx:10}
      .chip3{fill:#5B104F; stroke:#F472B6; stroke-opacity:.5; rx:10}
      .lane{fill:#0D131C; stroke:#1F2937; rx:14}
      .arrow{stroke:#34D399; stroke-width:3; marker-end:url(#m1)}
      .arrowB{stroke:#60A5FA; stroke-width:3; marker-end:url(#m2)}
      .arrowP{stroke:#F472B6; stroke-width:3; marker-end:url(#m3)}
      .kicker{fill:#A7F3D0; font-size:13px}
    </style>
    <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <polyline points="0,0 10,5 0,10" fill="#34D399"/>
    </marker>
    <marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <polyline points="0,0 10,5 0,10" fill="#60A5FA"/>
    </marker>
    <marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <polyline points="0,0 10,5 0,10" fill="#F472B6"/>
    </marker>
  </defs>

  <!-- фон -->
  <rect x="0" y="0" width="1200" height="700" fill="#0B0F14"/>
  <ellipse cx="250" cy="120" rx="260" ry="160" fill="url(#g1)" opacity=".25"/>
  <ellipse cx="980" cy="620" rx="280" ry="170" fill="url(#g1)" opacity=".20"/>
  <ellipse cx="600" cy="350" rx="360" ry="220" fill="url(#g1)" opacity=".18"/>

  <!-- заголовок -->
  <text x="50" y="70" class="txt title" style="font-size:30px">Запуск проекта (две кнопки)</text>
  <text x="50" y="98" class="txt muted">Локально: <tspan class="kicker">npm i → npm run dev</tspan> • Docker: <tspan class="kicker">docker compose up -d --build</tspan></text>

  <!-- дорожки -->
  <rect x="40" y="125" width="1120" height="220" class="lane"/>
  <text x="60" y="150" class="txt muted">Локальный запуск</text>

  <rect x="40" y="375" width="1120" height="260" class="lane"/>
  <text x="60" y="400" class="txt muted">Запуск в Docker</text>

  <!-- ===== ЛОКАЛЬНО ===== -->
  <!-- Hardhat node -->
  <rect x="60" y="170" width="250" height="140" class="card" filter="url(#shadow)"/>
  <text x="85" y="205" class="txt title">Hardhat Node</text>
  <rect x="85" y="225" width="200" height="28" class="chip"/><text x="95" y="245" class="txt label">:8545 • chainId=31337</text>
  <rect x="85" y="261" width="210" height="28" class="chip"/><text x="95" y="281" class="txt label">npm run contracts:node</text>

  <!-- Deploy -->
  <rect x="340" y="170" width="260" height="140" class="card" filter="url(#shadow)"/>
  <text x="365" y="205" class="txt title">Deploy Script</text>
  <rect x="365" y="225" width="210" height="28" class="chip"/><text x="375" y="245" class="txt label">адрес контракта</text>
  <rect x="365" y="261" width="230" height="28" class="chip"/><text x="375" y="281" class="txt label">обновляет FE/BE config</text>

  <!-- Backend -->
  <rect x="630" y="170" width="240" height="140" class="card" filter="url(#shadow)"/>
  <text x="655" y="205" class="txt title">Backend API</text>
  <rect x="655" y="225" width="200" height="28" class="chip2"/><text x="665" y="245" class="txt label">http://localhost:4000</text>
  <rect x="655" y="261" width="190" height="28" class="chip2"/><text x="665" y="281" class="txt label">Prisma + MySQL</text>

  <!-- Frontend -->
  <rect x="900" y="170" width="240" height="140" class="card" filter="url(#shadow)"/>
  <text x="925" y="205" class="txt title">Frontend (Vite)</text>
  <rect x="925" y="225" width="200" height="28" class="chip2"/><text x="935" y="245" class="txt label">http://localhost:5173</text>
  <rect x="925" y="261" width="210" height="28" class="chip2"/><text x="935" y="281" class="txt label">VITE_CONTRACT_ADDRESS</text>

  <!-- arrows local -->
  <line x1="310" y1="290" x2="340" y2="290" class="arrow"/>
  <text x="305" y="320" class="txt muted">deploy</text>

  <line x1="600" y1="290" x2="630" y2="290" class="arrow"/>
  <text x="580" y="320" class="txt muted">cfg → BE</text>

  <line x1="870" y1="290" x2="900" y2="290" class="arrow"/>
  <text x="850" y="320" class="txt muted">cfg → FE</text>

  <!-- ===== DOCKER ===== -->
  <!-- mysql -->
  <rect x="60" y="430" width="260" height="170" class="card" filter="url(#shadow)"/>
  <text x="85" y="465" class="txt title">MySQL (Docker)</text>
  <rect x="85" y="485" width="220" height="28" class="chip"/><text x="95" y="505" class="txt label">onlinecasino @ 3306</text>
  <rect x="85" y="521" width="230" height="28" class="chip"/><text x="95" y="541" class="txt label">schema.sql автозагрузка</text>

  <!-- hardhat container -->
  <rect x="350" y="430" width="240" height="170" class="card" filter="url(#shadow)"/>
  <text x="375" y="465" class="txt title">Hardhat (Docker)</text>
  <rect x="375" y="485" width="200" height="28" class="chip"/><text x="385" y="505" class="txt label">:8545 / healthcheck</text>
  <rect x="375" y="521" width="210" height="28" class="chip"/><text x="385" y="541" class="txt label">/out/slot.env, slot.json</text>

  <!-- backend docker -->
  <rect x="620" y="430" width="240" height="170" class="card" filter="url(#shadow)"/>
  <text x="645" y="465" class="txt title">Backend (Docker)</text>
  <rect x="645" y="485" width="210" height="28" class="chip2"/><text x="655" y="505" class="txt label">RPC_URL_31337=hardhat:8545</text>
  <rect x="645" y="521" width="200" height="28" class="chip2"/><text x="655" y="541" class="txt label">CHAIN_ID_DEFAULT=31337</text>

  <!-- frontend docker -->
  <rect x="890" y="430" width="240" height="170" class="card" filter="url(#shadow)"/>
  <text x="915" y="465" class="txt title">Frontend (Docker)</text>
  <rect x="915" y="485" width="210" height="28" class="chip2"/><text x="925" y="505" class="txt label">VITE_API_URL=backend:4000</text>
  <rect x="915" y="521" width="210" height="28" class="chip2"/><text x="925" y="541" class="txt label">VITE_CONTRACT_ADDRESS</text>

  <!-- arrows docker -->
  <line x1="320" y1="585" x2="350" y2="585" class="arrow"/>
  <text x="290" y="615" class="txt muted">depends_on</text>

  <line x1="590" y1="585" x2="620" y2="585" class="arrowB"/>
  <text x="580" y="615" class="txt muted">env → BE</text>

  <line x1="860" y1="585" x2="890" y2="585" class="arrowB"/>
  <text x="840" y="615" class="txt muted">env → FE</text>

</svg>