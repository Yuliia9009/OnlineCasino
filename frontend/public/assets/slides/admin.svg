<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10B981" flood-opacity="0.25"/>
    </filter>
    <style>
      .card{fill:url(#g2);stroke:#1F2937;stroke-width:1.5;rx:16}
      .txt{font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial;}
      .title{fill:#E5E7EB;font-weight:700;font-size:22px}
      .muted{fill:#9CA3AF;font-size:15px}
      .label{fill:#D1FAE5;font-size:14px}
      .chip{fill:#065F46; stroke:#10B981; stroke-opacity:.5; rx:10}
      .chip2{fill:#0B3B74; stroke:#60A5FA; stroke-opacity:.5; rx:10}
      .chip3{fill:#5B104F; stroke:#F472B6; stroke-opacity:.5; rx:10}
    </style>
  </defs>

  <!-- фон -->
  <rect x="0" y="0" width="1200" height="700" fill="#0B0F14"/>
  <ellipse cx="250" cy="120" rx="260" ry="160" fill="url(#g1)" opacity=".25"/>
  <ellipse cx="980" cy="620" rx="280" ry="170" fill="url(#g1)" opacity=".20"/>
  <ellipse cx="600" cy="350" rx="360" ry="220" fill="url(#g1)" opacity=".18"/>

  <!-- заголовок -->
  <text x="50" y="70" class="txt title" style="font-size:30px">Admin Panel</text>
  <text x="50" y="98" class="txt muted">Статистика, управление и проверка транзакций</text>

  <!-- Блок 1: Общая статистика -->
  <rect x="80" y="150" width="300" height="160" class="card" filter="url(#shadow)"/>
  <text x="105" y="185" class="txt title">📊 Общая статистика</text>
  <rect x="105" y="205" width="250" height="28" class="chip"/><text x="115" y="225" class="txt label">Ставки / Выплаты</text>
  <rect x="105" y="241" width="220" height="28" class="chip"/><text x="115" y="261" class="txt label">RTP (Return-to-Player)</text>

  <!-- Блок 2: Игроки -->
  <rect x="450" y="150" width="300" height="160" class="card" filter="url(#shadow)"/>
  <text x="475" y="185" class="txt title">👤 Игроки</text>
  <rect x="475" y="205" width="250" height="28" class="chip2"/><text x="485" y="225" class="txt label">Нетто по ETH</text>
  <rect x="475" y="241" width="220" height="28" class="chip2"/><text x="485" y="261" class="txt label">Активность игроков</text>
  <rect x="475" y="277" width="220" height="28" class="chip2"/><text x="485" y="297" class="txt label">История спинов</text>

  <!-- Блок 3: Транзакции -->
  <rect x="820" y="150" width="300" height="160" class="card" filter="url(#shadow)"/>
  <text x="845" y="185" class="txt title">🧾 Транзакции</text>
  <rect x="845" y="205" width="250" height="28" class="chip3"/><text x="855" y="225" class="txt label">Лента последних игр</text>
  <rect x="845" y="241" width="220" height="28" class="chip3"/><text x="855" y="261" class="txt label">Проверка по txHash</text>

  <!-- Нижний блок: API -->
  <rect x="300" y="360" width="600" height="220" class="card" filter="url(#shadow)"/>
  <text x="325" y="395" class="txt title">Backend API (для админки)</text>
  <rect x="325" y="420" width="220" height="28" class="chip"/><text x="335" y="440" class="txt label">/api/admin/stats</text>
  <rect x="555" y="420" width="250" height="28" class="chip"/><text x="565" y="440" class="txt label">/api/admin/players</text>
  <rect x="325" y="460" width="300" height="28" class="chip"/><text x="335" y="480" class="txt label">/api/admin/transactions</text>
  <text x="325" y="520" class="txt muted">Все данные берутся из MySQL через Prisma</text>
</svg>