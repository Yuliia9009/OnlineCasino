<svg width="1200" height="700"
     viewBox="0 0 1200 700"
     xmlns="http://www.w3.org/2000/svg"
     style="pointer-events:none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10B981" flood-opacity="0.25"/>
    </filter>
    <style>
      .card{fill:url(#g2);stroke:#1F2937;stroke-width:1.5;rx:16}
      .txt{font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial;}
      .title{fill:#E5E7EB;font-weight:700;font-size:22px}
      .muted{fill:#9CA3AF;font-size:15px}
      .label{fill:#D1FAE5;font-size:14px}
      .chip{fill:#065F46; stroke:#10B981; stroke-opacity:.5; rx:10}
      .arrow{stroke:#34D399; stroke-width:3; marker-end:url(#m1)}
      .arrow2{stroke:#60A5FA; stroke-width:3; marker-end:url(#m2)}
      .arrow3{stroke:#F472B6; stroke-width:3; marker-end:url(#m3)}
    </style>
    <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polyline points="0,0 10,5 0,10" fill="#34D399"/>
    </marker>
    <marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <polyline points="0,0 10,5 0,10" fill="#60A5FA"/>
    </marker>
    <marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <polyline points="0,0 10,5 0,10" fill="#F472B6"/>
    </marker>
  </defs>

  <!-- фоновые «неон» пятна -->
  <rect x="0" y="0" width="1200" height="700" fill="#0B0F14"/>
  <ellipse cx="250" cy="120" rx="260" ry="160" fill="url(#g1)" opacity=".25"/>
  <ellipse cx="980" cy="620" rx="280" ry="170" fill="url(#g1)" opacity=".20"/>
  <ellipse cx="600" cy="350" rx="360" ry="220" fill="url(#g1)" opacity=".18"/>

  <!-- заголовок -->
  <text x="50" y="70" class="txt title" style="font-size:30px">Ончейн-поток: Игрок ↔ SlotMachine ↔ Выплаты</text>
  <text x="50" y="98" class="txt muted">События: Deposit, SpinResult, Withdraw — индексируются бэкендом</text>

  <!-- Колонка 1: Игрок -->
  <rect x="70" y="150" width="280" height="180" class="card" filter="url(#shadow)"/>
  <text x="95" y="190" class="txt title">Игрок (MetaMask)</text>
  <text x="95" y="220" class="txt muted">Депозит, Спин, Вывод</text>
  <rect x="95" y="240" width="160" height="28" class="chip"/><text x="105" y="259" class="txt label">address: 0x…</text>
  <rect x="95" y="276" width="120" height="28" class="chip"/><text x="105" y="295" class="txt label">balance: ETH</text>

  <!-- Колонка 2: Контракт -->
  <rect x="460" y="140" width="300" height="220" class="card" filter="url(#shadow)"/>
  <text x="485" y="180" class="txt title">Smart-contract: SlotMachine</text>
  <text x="485" y="208" class="txt muted">Принимает ставки и эмитит события</text>
  <rect x="485" y="230" width="250" height="28" class="chip"/><text x="495" y="249" class="txt label">events: Deposit / SpinResult / Withdraw</text>
  <rect x="485" y="266" width="225" height="28" class="chip"/><text x="495" y="285" class="txt label">payouts: адрес→игроку</text>

  <!-- Колонка 3: Банк/Казна -->
  <rect x="880" y="150" width="280" height="180" class="card" filter="url(#shadow)"/>
  <text x="905" y="190" class="txt title">Казна (баланс контракта)</text>
  <text x="905" y="220" class="txt muted">Вывод выигрышей</text>
  <rect x="905" y="240" width="200" height="28" class="chip"/><text x="915" y="259" class="txt label">payouts в ETH</text>

  <!-- Нижний блок: Backend/Индексатор -->
  <rect x="300" y="410" width="600" height="200" class="card" filter="url(#shadow)"/>
  <text x="325" y="450" class="txt title">Backend / Индексатор</text>
  <text x="325" y="480" class="txt muted">Слушает события, пишет в MySQL, отдаёт REST API</text>
  <rect x="325" y="500" width="180" height="28" class="chip"/><text x="335" y="519" class="txt label">/api/spins, /api/stats…</text>
  <rect x="515" y="500" width="170" height="28" class="chip"/><text x="525" y="519" class="txt label">Prisma + MySQL</text>
  <rect x="695" y="500" width="180" height="28" class="chip"/><text x="705" y="519" class="txt label">лента / админка</text>

  <!-- Стрелки -->
  <!-- Игрок -> Контракт (Deposit/Spin) -->
  <line x1="350" y1="230" x2="460" y2="230" class="arrow"/>
  <text x="350" y="215" class="txt muted">deposit / spin</text>

  <!-- Контракт -> Казна (деньги хранятся на контракте) -->
  <line x1="760" y1="230" x2="880" y2="230" class="arrow2"/>
  <text x="760" y="215" class="txt muted">баланс контракта</text>

  <!-- Контракт -> Игрок (Withdraw / payout) -->
  <line x1="460" y1="300" x2="350" y2="300" class="arrow2"/>
  <text x="350" y="282" class="txt muted">payout/withdraw</text>

  <!-- Контракт -> Backend (Events) -->
  <line x1="610" y1="360" x2="610" y2="410" class="arrow3"/>
  <text x="595" y="395" class="txt muted" transform="rotate(90 625 395)">events</text>
</svg>